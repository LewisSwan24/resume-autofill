apply plugin: 'com.android.application'

// Release signing. The key and its passwords never live in this repo: they come from a properties file elsewhere,
// by default ~/.raf-signing/keystore.properties, or the path in the RAF_SIGNING_PROPERTIES environment variable.
// The file holds four lines:
//   storeFile=raf-release.jks      (relative paths are read from the properties file's folder)
//   storePassword=...
//   keyAlias=raf
//   keyPassword=...
// Without the file, assembleRelease still builds, but the APK is unsigned and Android will not install it.
def signingPropsFile = file(System.getenv('RAF_SIGNING_PROPERTIES') ?: "${System.getProperty('user.home')}/.raf-signing/keystore.properties")
def signingProps = new Properties()
if (signingPropsFile.isFile()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { k ->
        if (!signingProps.getProperty(k)) throw new GradleException("${signingPropsFile} has no ${k}")
    }
} else {
    logger.warn("Release signing: ${signingPropsFile} not found, so the release APK will be unsigned.")
}

def rafVersionCode = (System.getenv("RAF_VERSION_CODE") ?: project.findProperty("RAF_VERSION_CODE") ?: "1").toInteger()
def rafVersionName = (System.getenv("RAF_VERSION_NAME") ?: project.findProperty("RAF_VERSION_NAME") ?: "0.2.0").toString()

android {
    namespace = "app.raf.dev"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.raf.dev"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode rafVersionCode
        versionName rafVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    flavorDimensions += "env"
    productFlavors {
        dev {
            dimension "env"
            applicationId "app.raf.dev"
        }
        prod {
            dimension "env"
            applicationId "app.raf.app"
        }
    }

    signingConfigs {
        if (!signingProps.isEmpty()) {
            release {
                def store = new File(signingProps.getProperty('storeFile'))
                storeFile store.isAbsolute() ? store : new File(signingPropsFile.parentFile, store.path)
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (!signingProps.isEmpty()) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // The fill browser: JavaScriptExecutionWorld, addWebMessageListener with a world, addJavaScriptOnEvent.
    implementation "androidx.webkit:webkit:1.18.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
