<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <title>Single-page application with a step of questions only (wizard fixture)</title>
  </head>
  <body>
    <h1>Internship application</h1>
    <div id="app">
      <section data-step="1">
        <h2>Step 1: About you</h2>
        <div class="row"><label for="s-first">First name</label> <input id="s-first" name="first_name" required autocomplete="off" /></div>
        <div class="row"><label for="s-last">Last name</label> <input id="s-last" name="last_name" required autocomplete="off" /></div>
        <div class="row"><label for="s-email">Email</label> <input id="s-email" name="email" type="email" required autocomplete="off" /></div>
        <div role="button" tabindex="0" class="next">下一步</div>
      </section>
      <section data-step="2" hidden>
        <h2>Step 2: A question</h2>
        <!-- Nothing here the resume answers: the step sends no report, and the card must not show step 1's numbers. -->
        <fieldset class="row">
          <legend>Have you worked with us before?</legend>
          <label><input type="radio" name="worked_before" value="yes" required /> Yes</label>
          <label><input type="radio" name="worked_before" value="no" /> No</label>
        </fieldset>
        <div role="button" tabindex="0" class="back">上一步</div>
        <div role="button" tabindex="0" class="next">下一步</div>
      </section>
      <section data-step="3" hidden>
        <h2>Step 3: Send</h2>
        <div role="button" tabindex="0" class="back">上一步</div>
        <button type="button" id="send">提交申请</button>
      </section>
    </div>
    <script type="module">
      import { countSends, singlePage } from './wizard.ts';
      singlePage(document.getElementById('app'));
      countSends(document.getElementById('send'));
    </script>
  </body>
</html>
