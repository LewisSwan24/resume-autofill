<!doctype html>
<!-- Device test page (resume keyboard): fields of each kind the keyboard tells apart, on 127.0.0.1:4180.
     No scripts, nothing is sent anywhere. -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>输入法示例页</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 16px; }
      label { display: block; margin: 12px 0 4px; }
      input, textarea { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; }
    </style>
  </head>
  <body>
    <h1>示例公司 网申（输入法）</h1>
    <form>
      <label for="name">姓名</label>
      <input id="name" name="name" type="text" autocomplete="off" />
      <label for="email">邮箱</label>
      <input id="email" name="email" type="email" autocomplete="off" />
      <label for="tel">手机</label>
      <input id="tel" name="tel" type="tel" autocomplete="off" />
      <label for="school">毕业院校</label>
      <input id="school" name="school" type="text" placeholder="学校" autocomplete="off" />
      <label for="password">登录密码</label>
      <input id="password" name="password" type="password" autocomplete="off" />
      <label for="code">验证码</label>
      <input id="code" name="code" type="text" placeholder="短信验证码" autocomplete="off" />
      <label for="about">自我介绍</label>
      <textarea id="about" name="about" rows="4"></textarea>
    </form>
  </body>
</html>
