<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- No network for anything but the app itself. script-src and default-src are left out on purpose: Capacitor
         puts its bridge into the page as an inline script. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="connect-src 'self' blob: data:; worker-src 'self' blob:; img-src 'self' blob: data:; font-src 'self' data:; media-src 'self' blob:; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'self'"
    />
    <title>简历资料</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
