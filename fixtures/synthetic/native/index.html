<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Graduate Program Application (native fixture)</title>
  </head>
  <body>
    <h1>Graduate Program Application</h1>
    <form id="application" novalidate>
      <!-- Personal details: label[for], label[for], wrapping label, aria-label only, placeholder only -->
      <fieldset>
        <legend>Personal details</legend>
        <div class="row">
          <label for="first-name">First name</label>
          <input id="first-name" name="first_name" type="text" required autocomplete="off" />
        </div>
        <div class="row">
          <label for="last-name">Last name</label>
          <input id="last-name" name="last_name" type="text" required autocomplete="off" />
        </div>
        <div class="row">
          <label>Preferred name <input name="preferred_name" type="text" autocomplete="off" /></label>
        </div>
        <div class="row">
          <input aria-label="Email" name="contact_email" type="email" required autocomplete="off" />
        </div>
        <div class="row phone">
          <select aria-label="Country code" name="phone_cc">
            <option value="">Select</option>
            <option value="+61">+61</option>
            <option value="+86">+86</option>
            <option value="+1">+1</option>
          </select>
          <input type="tel" name="phone_number" placeholder="Mobile number" autocomplete="off" />
        </div>
        <div class="row">
          <label for="pronouns">Pronouns</label>
          <select id="pronouns" name="pronouns">
            <option value="">Select</option>
            <option value="he">He/him</option>
            <option value="she">She/her</option>
            <option value="they">They/them</option>
            <option value="none">Prefer not to say</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Address</legend>
        <div class="row">
          <label for="street">Street</label>
          <input id="street" name="street" type="text" autocomplete="off" />
        </div>
        <div class="row">
          <span id="suburb-label">Suburb/City</span>
          <input aria-labelledby="suburb-label" name="suburb" type="text" autocomplete="off" />
        </div>
        <div class="row">
          <label for="state">State</label>
          <select id="state" name="state">
            <option value="">Select</option>
            <option value="NSW">NSW</option>
            <option value="VIC">VIC</option>
            <option value="QLD">QLD</option>
            <option value="WA">WA</option>
            <option value="SA">SA</option>
            <option value="TAS">TAS</option>
            <option value="ACT">ACT</option>
            <option value="NT">NT</option>
          </select>
        </div>
        <div class="row">
          <label for="postcode">Postcode</label>
          <input id="postcode" name="postcode" type="text" inputmode="numeric" maxlength="4" autocomplete="off" />
        </div>
      </fieldset>

      <!-- Links: name-only input (no visible label), id + placeholder input -->
      <fieldset>
        <legend>Links</legend>
        <div class="row"><input type="url" name="linkedin_url" autocomplete="off" /></div>
        <div class="row">
          <input type="url" id="githubProfile" placeholder="GitHub profile URL" autocomplete="off" />
        </div>
      </fieldset>

      <fieldset>
        <legend>Work rights</legend>
        <div class="row">
          <label for="work-rights">Work rights in Australia</label>
          <select id="work-rights" name="work_rights">
            <option value="">Select</option>
            <option value="citizen">Australian citizen</option>
            <option value="pr">Permanent resident</option>
            <option value="temp_full">Temporary visa with full work rights</option>
            <option value="student">Student visa</option>
            <option value="none">No work rights</option>
          </select>
        </div>
        <div class="row">
          <label for="visa-expiry">Visa expiry date</label>
          <input id="visa-expiry" name="visa_expiry" type="date" />
        </div>
        <fieldset class="row" role="radiogroup">
          <legend>Will you now or in the future require sponsorship?</legend>
          <label><input type="radio" name="sponsorship" value="yes" /> Yes</label>
          <label><input type="radio" name="sponsorship" value="no" /> No</label>
        </fieldset>
      </fieldset>

      <!-- Education: table with column headers only; cells carry no label -->
      <fieldset>
        <legend>Education</legend>
        <table id="education">
          <thead>
            <tr>
              <th scope="col">Institution</th>
              <th scope="col">Degree</th>
              <th scope="col">Field of study</th>
              <th scope="col">Start</th>
              <th scope="col">End</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><input type="text" /></td>
              <td>
                <select>
                  <option value="">Select</option>
                  <option value="bachelor">Bachelor</option>
                  <option value="master">Master</option>
                  <option value="doctorate">Doctorate</option>
                  <option value="diploma">Diploma</option>
                </select>
              </td>
              <td><input type="text" /></td>
              <td><input type="month" /></td>
              <td><input type="month" /></td>
            </tr>
            <tr>
              <td><input type="text" /></td>
              <td>
                <select>
                  <option value="">Select</option>
                  <option value="bachelor">Bachelor</option>
                  <option value="master">Master</option>
                  <option value="doctorate">Doctorate</option>
                  <option value="diploma">Diploma</option>
                </select>
              </td>
              <td><input type="text" /></td>
              <td><input type="month" /></td>
              <td><input type="month" /></td>
            </tr>
          </tbody>
        </table>
      </fieldset>

      <!-- Employment: starts with one card, "+ Add another" appends an identical one (native/main.ts) -->
      <fieldset>
        <legend>Employment</legend>
        <div id="employment-list"></div>
        <button type="button" id="add-employment">+ Add another</button>
      </fieldset>

      <fieldset>
        <legend>Preferences</legend>
        <div class="row">
          <label for="preferred-location">Preferred location</label>
          <select id="preferred-location" name="preferred_location">
            <option value="">Select</option>
            <option value="syd">Sydney</option>
            <option value="mel">Melbourne</option>
            <option value="per">Perth</option>
          </select>
        </div>
      </fieldset>

      <fieldset>
        <legend>About you</legend>
        <div
          id="about-you"
          contenteditable="true"
          role="textbox"
          aria-multiline="true"
          aria-label="Tell us about yourself"
        ></div>
      </fieldset>

      <fieldset>
        <legend>Documents</legend>
        <div class="row">
          <label for="resume-file">Resume/CV</label>
          <input id="resume-file" name="resume" type="file" accept=".pdf" />
        </div>
      </fieldset>

      <fieldset>
        <legend>Additional information</legend>
        <div class="row">
          <label for="indigenous">Do you identify as Aboriginal or Torres Strait Islander?</label>
          <select id="indigenous" name="indigenous">
            <option value="">Select</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
            <option value="pns">Prefer not to say</option>
          </select>
        </div>
        <div class="row">
          <label for="how-heard">How did you hear about us?</label>
          <select id="how-heard" name="how_heard">
            <option value="">Select</option>
            <option value="linkedin">LinkedIn</option>
            <option value="seek">Seek</option>
            <option value="fair">University careers fair</option>
            <option value="other">Other</option>
          </select>
        </div>
      </fieldset>

      <!-- Same-origin iframe; its state is merged into the parent's __fixtureState() under frame.* -->
      <fieldset>
        <legend>More questions</legend>
        <iframe title="Additional questions" src="./frame.html"></iframe>
      </fieldset>

      <!-- Traps: must stay untouched -->
      <fieldset>
        <legend>Verification</legend>
        <div class="row">
          <label for="verification-code">Verification code</label>
          <input id="verification-code" name="verification_code" type="text" autocomplete="off" />
        </div>
        <div class="row">
          <label><input type="checkbox" name="privacy" /> I agree to the privacy policy</label>
        </div>
      </fieldset>

      <button type="submit">Submit application</button>
    </form>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
