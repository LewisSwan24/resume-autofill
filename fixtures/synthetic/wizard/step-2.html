<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <title>Application, step 2 of 3 (wizard fixture)</title>
  </head>
  <body>
    <h1>Graduate application</h1>
    <ol class="steps"><li>Personal details</li><li aria-current="step">Contact</li><li>Review</li></ol>
    <form id="f">
      <div class="row"><label for="email">Email</label> <input id="email" name="email" type="email" required autocomplete="off" /></div>
      <div class="row"><label for="phone">Mobile number</label> <input id="phone" name="phone" type="tel" autocomplete="off" /></div>
      <button type="button" id="back">Back</button>
      <button type="submit">Save and Continue</button>
    </form>
    <script type="module">
      import { goesTo } from './wizard.ts';
      document.getElementById('back').addEventListener('click', () => history.back());
      goesTo(document.getElementById('f'), 'step-3.html', ['email']);
    </script>
  </body>
</html>
